<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sarah Luisa Wurmer — Zither</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#EDE7DD;
    --ink:#171512;
    --indigo:#2A3560;
    --teal:#5FC8B8;
    --coral:#E29580;
    --coral-dark:#B85A3E;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--ink);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  a{color:inherit;text-decoration:none;}

  .page{
    position:relative;
    height:100dvh;
    width:100%;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .page img.bg{
    position:absolute;
    inset:0;
    width:100%;height:100%;
    object-fit:cover;
    object-position:44% 15%;
    z-index:0;
  }
  .scrim-left{
    position:absolute;
    inset:0;
    background:linear-gradient(100deg, rgba(15,14,11,0.66) 0%, rgba(15,14,11,0.34) 30%, rgba(15,14,11,0) 55%);
    z-index:1;
  }
  .scrim-bottom{
    position:absolute;
    left:0;right:0;bottom:0;
    height:22%;
    background:linear-gradient(180deg, rgba(15,14,11,0) 0%, rgba(15,14,11,0.6) 100%);
    z-index:1;
  }

  /* ---------- Nav ---------- */
  header{
    position:relative;
    z-index:5;
    display:flex;
    justify-content:flex-end;
    align-items:center;
    padding:1.6rem clamp(1.2rem,4vw,3.2rem) 0;
    flex-shrink:0;
  }
  nav ul{
    display:flex;
    gap:clamp(1rem,2.5vw,2.2rem);
    list-style:none;
    margin:0;padding:0;
  }
  nav a{
    color:rgba(255,255,255,0.85);
    font-size:0.86rem;
    letter-spacing:0.03em;
    position:relative;
    padding-bottom:3px;
    transition:color .3s ease, text-shadow .3s ease;
  }
  nav a::after{
    content:"";
    position:absolute;
    left:0;bottom:0;
    width:0;height:1px;
    background:var(--teal);
    transition:width .35s ease;
  }
  nav a:hover{
    color:#fff;
    text-shadow:0 0 10px rgba(95,200,184,0.85), 0 0 22px rgba(95,200,184,0.5);
  }
  nav a:hover::after{width:100%;}

  /* ---------- Submenu (e.g. Medien > CD Intimacy), shown on hover ---------- */
  .has-submenu{position:relative;}
  .submenu{
    position:absolute;
    top:100%;left:0;
    padding:1rem 0 0;
    min-width:130px;
    list-style:none;
    opacity:0;
    transform:translateY(-6px);
    pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
  }
  .has-submenu:hover .submenu,
  .has-submenu:focus-within .submenu{
    opacity:1;
    transform:translateY(0);
    pointer-events:auto;
  }
  .submenu a{
    display:block;
    padding:0.5rem 1.1rem;
    font-size:0.82rem;
    color:rgba(255,255,255,0.85);
    white-space:nowrap;
  }
  .submenu a:hover{color:var(--teal);}

  /* ---------- Main content grid ---------- */
  main{
    position:relative;
    z-index:5;
    flex:1;
    display:grid;
    grid-template-columns:1.1fr 0.9fr;
    align-items:stretch;
    padding:0 clamp(1.2rem,4vw,3.2rem);
    min-height:0;
  }

  .name-block{
    align-self:flex-start;
    padding-top:clamp(1.6rem,4vh,2.6rem);
    color:#fff;
  }
  .eyebrow{
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:clamp(0.95rem,1.6vw,1.25rem);
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--teal);
    display:block;
    margin:0 0 1.3rem;
  }
  .name-block h1{
    font-family:'Bricolage Grotesque',sans-serif;
    font-weight:600;
    font-size:clamp(2.1rem,5.4vw,3.6rem);
    line-height:1.05;
    letter-spacing:-0.015em;
    margin:0 0 1.1rem;
  }
  .name-block .string{
    width:38%;
    max-width:220px;
    height:1px;
    background:linear-gradient(90deg, var(--teal), rgba(255,255,255,0.15));
    margin-bottom:1.1rem;
  }
  .pill{
    font-size:0.84rem;
    padding:0.65rem 1.2rem;
    border:1px solid rgba(255,255,255,0.55);
    border-radius:999px;
    transition:background .3s ease, color .3s ease, border-color .3s ease;
    white-space:nowrap;
  }
  .pill:hover{border-color:#fff;background:rgba(255,255,255,0.14);}

  .aktuell-block{
    align-self:flex-start;
    margin-top:clamp(1.6rem,4vh,2.6rem);
    max-width:360px;
    margin-left:auto;
    background:transparent;
    border:1px solid rgba(226,149,128,0.65);
    backdrop-filter:blur(14px) saturate(140%);
    -webkit-backdrop-filter:blur(14px) saturate(140%);
    border-radius:16px;
    padding:1.4rem 1.5rem;
  }
  .aktuell-block .eyebrow{
    color:var(--coral-dark);
    text-shadow:0 1px 3px rgba(255,255,255,0.5);
    margin-bottom:0.6rem;
  }
  .next-termin-link{
    display:block;
  }
  .nt-date{
    display:block;
    font-family:'IBM Plex Mono',monospace;
    font-weight:500;
    font-size:0.85rem;
    color:var(--teal);
    margin-bottom:0.4rem;
    text-shadow:0 1px 3px rgba(255,255,255,0.4);
  }
  .nt-titel{
    display:block;
    font-family:'Bricolage Grotesque',sans-serif;
    font-weight:600;
    font-size:1.08rem;
    line-height:1.35;
    color:var(--ink);
    margin-bottom:0.35rem;
    transition:color .3s ease;
    text-shadow:0 1px 3px rgba(255,255,255,0.4);
  }
  .nt-ort{
    display:block;
    font-size:0.85rem;
    color:rgba(23,21,18,0.68);
    text-shadow:0 1px 3px rgba(255,255,255,0.4);
  }
  .next-termin-link:hover .nt-titel{color:var(--coral-dark);}

  /* ---------- Bottom bar ---------- */
  footer{
    position:relative;
    z-index:5;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:1.4rem;
    flex-wrap:wrap;
    padding:0 clamp(1.2rem,4vw,3.2rem) clamp(1.4rem,3.4vh,2.2rem);
    flex-shrink:0;
  }
  .newsletter-col{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:0.7rem;
    flex:1;
    min-width:220px;
    max-width:320px;
  }
  .newsletter-col .pill{
    color:#fff;
  }
  form.signup{
    display:flex;
    align-items:center;
    border-bottom:1px solid rgba(255,255,255,0.5);
    width:100%;
  }
  form.signup input{
    flex:1;
    background:transparent;
    border:none;
    color:#fff;
    font-family:'Inter',sans-serif;
    font-size:0.92rem;
    padding:0.5rem 0.2rem;
    outline:none;
  }
  form.signup input::placeholder{color:rgba(255,255,255,0.55);}
  form.signup button{
    background:none;
    border:none;
    color:var(--teal);
    cursor:pointer;
    display:flex;
    align-items:center;
    padding:0.4rem;
  }
  form.signup button:hover{color:#fff;}
  form.signup button svg{width:18px;height:18px;}

  .socials{
    display:flex;
    gap:1.1rem;
    flex-shrink:0;
  }
  .socials a{
    display:flex;
    align-items:center;
    justify-content:center;
    width:38px;height:38px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,0.45);
    color:#fff;
    transition:background .3s ease, border-color .3s ease;
  }
  .socials a svg{width:17px;height:17px;}
  .socials a:hover{background:rgba(255,255,255,0.16);border-color:#fff;}

  /* ---------- Responsive ---------- */
  @media(max-width:820px){
    body{overflow-y:auto;}
    .page{height:auto;min-height:100dvh;}
    main{
      grid-template-columns:1fr;
      gap:1.6rem;
      padding-top:1.2rem;
    }
    .aktuell-block{margin-left:0;max-width:none;align-self:auto;margin-top:0;}
    .name-block{align-self:auto;padding-bottom:0.4rem;}
    footer{
      flex-direction:column;
      align-items:stretch;
      gap:1rem;
    }
    .socials{justify-content:center;}
  }

  .legal-links{
    position:fixed;
    bottom:5.5rem;left:1.1rem;
    z-index:90;
    display:flex;
    gap:0.5rem;
  }
  .legal-links a{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.7rem;
    color:#fff;
    background:rgba(23,21,18,0.55);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    padding:0.45rem 0.85rem;
    border-radius:999px;
    transition:background .3s ease;
  }
  .legal-links a:hover{background:var(--coral-dark);}
</style>
</head>

<script>
(function(){
  var SHEET_ID = "1fKlSevXrU3xcedsUj2UGBNeDw2BEh7OnCQ7lGGTVBcA";
  var SHEET_NAME = "Tabellenblatt1";
  var CALLBACK_NAME = "slwNextTerminHandler";
  var MONTHS = ['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];

  function cellValue(cell){
    if(!cell) return "";
    if(cell.f !== undefined && cell.f !== null && cell.f !== "") return cell.f;
    if(cell.v !== undefined && cell.v !== null) return cell.v;
    return "";
  }

  function formatDate(raw){
    var t = String(raw || "").trim();
    var m = /^(\d{1,2})\.(\d{1,2})\.(\d{2,4})$/.exec(t);
    if(m){
      var day = parseInt(m[1],10);
      var month = parseInt(m[2],10);
      var year = m[3].length === 2 ? "20" + m[3] : m[3];
      var label = MONTHS[month-1] || "";
      return day + ". " + label + " " + year;
    }
    return t;
  }

  window[CALLBACK_NAME] = function(response){
    try{
      var rows = (response && response.table && response.table.rows) || [];
      if(!rows.length) return;
      var c = rows[0].c || [];
      var datum = cellValue(c[0]);
      var titel = cellValue(c[2]);
      var ort = cellValue(c[4]);
      if(!titel) return;

      var el = document.getElementById("next-termin");
      if(!el) return;
      var dateEl = el.querySelector(".nt-date");
      var titelEl = el.querySelector(".nt-titel");
      var ortEl = el.querySelector(".nt-ort");
      if(dateEl) dateEl.textContent = formatDate(datum);
      if(titelEl) titelEl.textContent = titel;
      if(ortEl) ortEl.textContent = ort;
    }catch(e){
      /* Fallback-Inhalt im HTML bleibt einfach stehen */
    }
  };

  var url = "https://docs.google.com/spreadsheets/d/" + SHEET_ID +
    "/gviz/tq?tqx=out:json;responseHandler:" + CALLBACK_NAME +
    "&sheet=" + encodeURIComponent(SHEET_NAME);

  var script = document.createElement("script");
  script.src = url;
  document.head.appendChild(script);
})();
</script>
