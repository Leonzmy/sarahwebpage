<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sarah Luisa Wurmer — Zither</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#EDE7DD;
    --ink:#171512;
    --indigo:#2A3560;
    --teal:#5FC8B8;
    --coral:#E29580;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--ink);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  a{color:inherit;text-decoration:none;}

  .page{
    position:relative;
    height:100dvh;
    width:100%;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .page img.bg{
    position:absolute;
    inset:0;
    width:100%;height:100%;
    object-fit:cover;
    object-position:44% 15%;
    z-index:0;
  }
  .scrim-left{
    position:absolute;
    inset:0;
    background:linear-gradient(100deg, rgba(15,14,11,0.66) 0%, rgba(15,14,11,0.34) 30%, rgba(15,14,11,0) 55%);
    z-index:1;
  }
  .scrim-bottom{
    position:absolute;
    left:0;right:0;bottom:0;
    height:22%;
    background:linear-gradient(180deg, rgba(15,14,11,0) 0%, rgba(15,14,11,0.6) 100%);
    z-index:1;
  }

  /* ---------- Nav ---------- */
  header{
    position:relative;
    z-index:5;
    display:flex;
    justify-content:flex-end;
    align-items:center;
    padding:0.9rem clamp(1.2rem,4vw,3.2rem);
    flex-shrink:0;
    background:rgba(38,40,43,0.82);
    backdrop-filter:blur(8px);
    box-shadow:0 1px 0 rgba(255,255,255,0.06);
  }
  nav ul{
    display:flex;
    gap:clamp(1rem,2.5vw,2.2rem);
    list-style:none;
    margin:0;padding:0;
  }
  nav a{
    color:rgba(255,255,255,0.85);
    font-size:0.86rem;
    letter-spacing:0.03em;
    position:relative;
    padding-bottom:3px;
    transition:color .3s ease, text-shadow .3s ease;
  }
  nav a::after{
    content:"";
    position:absolute;
    left:0;bottom:0;
    width:0;height:1px;
    background:var(--teal);
    transition:width .35s ease;
  }
  nav a:hover{
    color:#fff;
    text-shadow:0 0 10px rgba(95,200,184,0.85), 0 0 22px rgba(95,200,184,0.5);
  }
  nav a:hover::after{width:100%;}

  /* ---------- Main content grid ---------- */
  main{
    position:relative;
    z-index:5;
    flex:1;
    display:grid;
    grid-template-columns:1.1fr 0.9fr;
    align-items:stretch;
    padding:0 clamp(1.2rem,4vw,3.2rem);
    min-height:0;
  }

  .name-block{
    align-self:flex-end;
    padding-bottom:clamp(1.6rem,4vh,2.6rem);
    color:#fff;
  }
  .eyebrow{
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:clamp(0.95rem,1.6vw,1.25rem);
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--teal);
    display:block;
    margin:0 0 1.3rem;
  }
  .name-block h1{
    font-family:'Inter',sans-serif;
    font-weight:500;
    font-size:clamp(2.1rem,5.4vw,3.6rem);
    line-height:1.05;
    letter-spacing:-0.01em;
    margin:0 0 1.1rem;
  }
  .name-block .string{
    width:38%;
    max-width:220px;
    height:1px;
    background:linear-gradient(90deg, var(--teal), rgba(255,255,255,0.15));
    margin-bottom:1.1rem;
  }
  .hero-links{
    display:flex;
    flex-wrap:wrap;
    gap:0.8rem;
  }
  .pill{
    font-size:0.84rem;
    padding:0.65rem 1.2rem;
    border:1px solid rgba(255,255,255,0.55);
    border-radius:999px;
    transition:background .3s ease, color .3s ease, border-color .3s ease;
    white-space:nowrap;
  }
  .pill:hover{border-color:#fff;background:rgba(255,255,255,0.14);}

  .aktuell-block{
    align-self:flex-start;
    margin-top:clamp(1.6rem,7vh,4rem);
    max-width:360px;
    margin-left:auto;
    background:rgba(237,231,221,0.5);
    backdrop-filter:blur(4px);
    border-radius:6px;
    padding:1.4rem 1.5rem;
  }
  .aktuell-block .eyebrow{
    color:var(--indigo);
    margin-bottom:0.6rem;
  }
  .aktuell-block p{
    margin:0;
    font-size:0.92rem;
    line-height:1.55;
    color:var(--ink);
  }
  .aktuell-block a{
    border-bottom:1px solid var(--indigo);
    color:var(--indigo);
    font-weight:500;
  }
  .aktuell-block a:hover{color:var(--coral);border-color:var(--coral);}

  /* ---------- Bottom bar ---------- */
  footer{
    position:relative;
    z-index:5;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:1.4rem;
    flex-wrap:wrap;
    padding:0 clamp(1.2rem,4vw,3.2rem) clamp(1.4rem,3.4vh,2.2rem);
    flex-shrink:0;
  }
  form.signup{
    display:flex;
    align-items:center;
    border-bottom:1px solid rgba(255,255,255,0.5);
    min-width:220px;
    max-width:320px;
    flex:1;
  }
  form.signup input{
    flex:1;
    background:transparent;
    border:none;
    color:#fff;
    font-family:'Inter',sans-serif;
    font-size:0.92rem;
    padding:0.5rem 0.2rem;
    outline:none;
  }
  form.signup input::placeholder{color:rgba(255,255,255,0.55);}
  form.signup button{
    background:none;
    border:none;
    color:var(--teal);
    cursor:pointer;
    display:flex;
    align-items:center;
    padding:0.4rem;
  }
  form.signup button:hover{color:#fff;}
  form.signup button svg{width:18px;height:18px;}

  .socials{
    display:flex;
    gap:1.1rem;
    flex-shrink:0;
  }
  .socials a{
    display:flex;
    align-items:center;
    justify-content:center;
    width:38px;height:38px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,0.45);
    color:#fff;
    transition:background .3s ease, border-color .3s ease;
  }
  .socials a svg{width:17px;height:17px;}
  .socials a:hover{background:rgba(255,255,255,0.16);border-color:#fff;}

  /* ---------- Responsive ---------- */
  @media(max-width:820px){
    body{overflow-y:auto;}
    .page{height:auto;min-height:100dvh;}
    main{
      grid-template-columns:1fr;
      gap:1.6rem;
      padding-top:1.2rem;
    }
    .aktuell-block{margin-left:0;max-width:none;align-self:auto;margin-top:0;}
    .name-block{align-self:auto;padding-bottom:0.4rem;}
    footer{
      flex-direction:column;
      align-items:stretch;
      gap:1rem;
    }
    .socials{justify-content:center;}
  }
</style>
</head>
<body>

<div class="page">
  <img class="bg"
    src="hero-2400.jpg"
    srcset="hero-1200.jpg 1200w, hero-2400.jpg 2400w"
    sizes="100vw"
    alt="Sarah Luisa Wurmer stehend neben ihrer Zither">
  <div class="scrim-left"></div>
  <div class="scrim-bottom"></div>

  <header>
    <nav>
      <ul>
        <li><a href="live.html">Live</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="projekte.html">Projekte</a></li>
        <li><a href="medien.html">Medien</a></li>
        <li><a href="kontakt.html">Kontakt</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <div class="name-block">
      <h1>Sarah Luisa<br>Wurmer</h1>
      <div class="string"></div>
      <span class="eyebrow">Zither</span>
      <div class="hero-links">
        <a class="pill" href="medien.html#intimacy">CD „Intimacy“</a>

    <div class="aktuell-block">

        und
        „<a href="https://www.deutschlandfunkkultur.de/steve-reich-piano-phase-mit-sarah-luisa-wurmer-und-tajda-krainc-100.html" target="_blank" rel="noopener">Piano Phase</a>“.
      </p>
    </div>
  </main>

  <footer>
    <form class="signup">
      <input type="email" placeholder="Newsletter — deine@email.de" required>
      <button type="submit" aria-label="Anmelden">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </button>
    </form>

    <div class="socials">
      <a href="#" target="_blank" rel="noopener" aria-label="Instagram">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1.1" fill="currentColor" stroke="none"/></svg>
      </a>
      <a href="#" target="_blank" rel="noopener" aria-label="YouTube">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2.5" y="6" width="19" height="12" rx="4"/><polygon points="10.5 9.3 15 12 10.5 14.7" fill="currentColor" stroke="none"/></svg>

      <a href="#" target="_blank" rel="noopener" aria-label="SoundCloud">

      </a>
    </div>
  </footer>
</div>

</body>
</html>
